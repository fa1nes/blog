name: 部署到 Cloudflare Pages

# 说明：
# 如果你在 Cloudflare 控制台里直接连接了 Git 仓库，就不需要这个工作流，
# Cloudflare 会自己拉取代码并构建。只有想用 Actions 主动推送产物时才需要它。
#
# 使用前需要在仓库的 Settings → Secrets and variables → Actions 里配置：
#   变量 (Variables)：CLOUDFLARE_PROJECT_NAME、SITE_URL
#   密钥 (Secrets)  ：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
# 未配置项目名时这个工作流会自动跳过，不会报错。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署
    if: vars.CLOUDFLARE_PROJECT_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      # Cloudflare Pages 部署在根路径，所以不需要设置 BASE_PATH
      - name: 构建站点
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: 发布到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
