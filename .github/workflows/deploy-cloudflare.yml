name: 部署到 Cloudflare Pages

# 两种接入方式，任选其一：
#
#   A. Cloudflare 控制台连接仓库（推荐）——不需要这个工作流
#      Pages → Create → Connect to Git → 选仓库，构建命令 `npm run build`，
#      输出目录 `dist`，环境变量 NODE_VERSION=22、SITE_URL=https://<项目>.pages.dev
#      Cloudflare 自己构建、自己上传，Push 即发布。
#
#   B. 用 Actions 主动推送（本工作流）——想让 GitHub 侧统一管理构建时可以开
#      在 Settings → Secrets and variables → Actions 里配置：
#        变量 (Variables)：CLOUDFLARE_PROJECT_NAME、SITE_URL
#        密钥 (Secrets)  ：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
#      没配 CLOUDFLARE_PROJECT_NAME 时整个任务自动跳过，不会报错。
#
# 为什么是 Pages 而不是 Workers：Pages 的静态请求不限量、不计费，
# Workers 免费额度是每天 10 万次请求，博客被人多刷几次就可能触顶。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署
    if: vars.CLOUDFLARE_PROJECT_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      # Pages 站点在域名根目录。astro.config.ts 会靠 CF_PAGES 自动识别，
      # 这里再显式传一次，避免任何情况下沿用配置里的 /blog 前缀。
      - name: 构建站点
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: /
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: npm run build

      - name: 发布到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
