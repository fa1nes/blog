name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
    # 只改文档不用重新构建整站
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # 内容仓库 push 后由它发 repository_dispatch 触发本工作流
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，但不打断正在进行的那个
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # node_modules 直接缓存：命中时连 npm ci 都省掉，构建快十几秒
      - name: 缓存依赖
        id: modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: 安装依赖
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v6

      - name: 类型检查
        run: npm run check

      # origin 与 base_path 由上一步自动得出：
      # 用仓库子路径时 base_path 形如 /repo，绑定自定义域名时为空字符串
      # 文章存放在私有仓库，构建时用只读令牌拉取
      - name: 构建站点
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
