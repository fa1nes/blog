# 后台配置文件。
#
# /admin/ 页面启动时会读这里的几项，所以换仓库、换分支、换 OAuth 代理地址
# 只改这个文件，不用动代码。后台不依赖任何 CMS 框架，就是一个普通页面。

backend:
  name: github
  # 内容仓库（私有）。公开仓库只有主题代码，文章都提交到这里。
  repo: fa1nes/blog-content
  branch: main
  # GitHub OAuth 代理（见 workers/cms-auth）。留空则只能粘贴令牌登录。
  base_url: https://fa1nes-blog-cms-auth.fa1ne.workers.dev

# 后台上传的图片存到内容仓库的 public/uploads/，
# 正文里用 /uploads/文件名 引用，构建时复制到站点根目录。
media_folder: public/uploads
public_folder: /uploads
